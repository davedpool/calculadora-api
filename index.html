<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora API Python</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        .calculator {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #495057;
            min-height: 24px;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Calculadora API</h2>

        <input type="number" id="num1" placeholder="Primer número">

        <select id="operacion">
            <option value="sumar">Sumar (+)</option>
            <option value="restar">Restar (-)</option>
            <option value="multiplicar">Multiplicar (×)</option>
            <option value="dividir">Dividir (÷)</option>
        </select>

        <input type="number" id="num2" placeholder="Segundo número">

        <button onclick="calcular()">Calcular</button>

        <div class="result-box" id="resultado">Resultado: -</div>
    </div>

    <script>
        async function calcular() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operacion = document.getElementById('operacion').value;
            const txtResultado = document.getElementById('resultado');

            if (num1 === '' || num2 === '') {
                txtResultado.innerText = "Por favor, llena ambos campos.";
                return;
            }

            txtResultado.innerText = "Calculando...";

            try {
                // Aquí JavaScript se conecta con tu API de FastAPI corriendo en el puerto 8000
                const respuesta = await fetch(`http://127.0.0.1:8000/${operacion}?num1=${num1}&num2=${num2}`);
                const datos = await respuesta.json();

                if (datos.error) {
                    txtResultado.innerText = `Error: ${datos.error}`;
                } else {
                    txtResultado.innerText = `Resultado: ${datos.resultado}`;
                }
            } catch (error) {
                txtResultado.innerText = "Error al conectar con la API.";
                console.error(error);
            }
        }
    </script>

</body>

</html>
